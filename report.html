/* ===================== 工具 ===================== */
const RED="#e23a3a", GREEN="#1aa260", ORANGE="#d97706";
function num(x){const n=parseFloat(x);return isNaN(n)?null:n;}
function fmtPct(p){return p==null?"—":(p>=0?"+":"")+p.toFixed(2)+"%";}
function fmtAmt(a){if(a==null)return "—";if(a>=10000)return (a/10000).toFixed(2)+"亿";if(a>=100)return (a/100).toFixed(2)+"万";return a.toFixed(0);}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function pctStyle(p){
  if(p==null) return ["color:#888","—"];
  const c = p>0?RED:(p<0?GREEN:"#333");
  return ["color:"+c, fmtPct(p)];
}
function bjNow(){
  const now=new Date();
  const fmt=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  const s=fmt.format(now).replace(/\//g,'-');
  const h=Number(new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',hour12:false}).format(now));
  return {now, str:s, hour:h};
}
function segmentOf(h){return h<9?"premarket":(h>=15?"afterclose":"intraday");}

/* ===================== 行情抓取（腾讯，CORS 开放） ===================== */
/* GBK 解码兼容：部分微信 WebView 的 TextDecoder 不支持 'gbk' 标签，先能力检测，
   不支持则降级为 utf-8（英文/数字可见，中文可能乱码但不崩）；主流程整体失败时回退同域 snapshot.json */
let _gbkDec; try { _gbkDec = new TextDecoder("gbk"); } catch(e) { _gbkDec = null; }
function decGbk(buf){ try { return (_gbkDec || new TextDecoder("utf-8")).decode(buf); } catch(e) { return ""; } }
async function fetchTx(codes){
  const out={};
  for(let i=0;i<codes.length;i+=40){
    const batch=codes.slice(i,i+40);
    const url="https://qt.gtimg.cn/q="+batch.join(",")+"&_="+Date.now();
    try{
      const resp=await fetch(url,{cache:"no-store"});
      const buf=await resp.arrayBuffer();
      const text=decGbk(buf);
      text.replace(/\r/g,"").split(";").forEach(line=>{
        try{ const q=parseTxLine(line); if(q) out[q.code]=q; }catch(e){}
      });
    }catch(e){ console.warn("tx fetch fail",batch[0],e); }
    await sleep(100);
  }
  return out;
}
function parseTxLine(line){
  const eq=line.indexOf("=");
  if(eq<0) return null;
  const code=line.slice(0,eq).replace(/^v_/,"").trim();
  if(!code) return null;
  let body=line.slice(eq+1).trim();
  if(body.startsWith('"')) body=body.slice(1);
  if(body.endsWith('"')) body=body.slice(0,-1);
  if(body.endsWith(";")) body=body.slice(0,-1);
  if(body.startsWith("~")||body.indexOf("~")<0) {} // keep
  const p=body.split("~");
  if(p.length<10) return null;
  const price=num(p[3]), prev=num(p[4]);
  let pct=num(p[32]);
  if(pct==null && price!=null && prev) pct=(price-prev)/prev*100;
  const high=num(p[33]), low=num(p[34]);
  let amount=null;
  if(p[57]) amount=num(p[57]);
  if(amount==null && p[37]) amount=num(p[37]);
  if(amount==null && p[35]){const c=p[35].split("/");if(c.length>=3)amount=num(c[2]);}
  let vr=num(p[56]);
  if(vr!=null && !(vr>=0.05 && vr<=50)) vr=null;
  let amp=num(p[43]);
  if(amp==null && high!=null && low!=null && prev) amp=(high-low)/prev*100;
  return {code,name:(p[1]||code),price,prev,pct,amount,vr,amp,high,low};
}
async function fetchKline(code){
  const url="https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param="+code+",day,,,70,qfq&_="+Date.now();
  try{
    const resp=await fetch(url,{cache:"no-store"});
    const js=await resp.json();
    const node=js&&js.data?js.data[code]:null;
    if(!node) return [];
    const arr=node.qfqday||node.day||[];
    const out=[];
    for(const it of arr){
      if(!Array.isArray(it)||it.length<6) continue;
      out.push({date:it[0],open:num(it[1]),close:num(it[2]),high:num(it[3]),low:num(it[4]),vol:num(it[5])});
    }
    return out;
  }catch(e){ console.warn("kline fail",code,e); return []; }
}
function analyzeKline(klines){
  if(!klines||klines.length<25) return null;
  const closes=klines.filter(k=>k.close!=null).map(k=>k.close);
  const vols=klines.filter(k=>k.vol!=null).map(k=>k.vol);
  if(closes.length<25) return null;
  const last=closes[closes.length-1];
  let pct=null;
  if(closes.length>=2 && closes[closes.length-2]) pct=(closes[closes.length-1]-closes[closes.length-2])/closes[closes.length-2]*100;
  const ma=n=>closes.length>=n?closes.slice(-n).reduce((a,b)=>a+b,0)/n:null;
  const ma5=ma(5),ma10=ma(10),ma20=ma(20),ma30=ma(30),ma60=ma(60);
  let band=null;
  if(ma20!=null && closes.length>=20){
    const sd=Math.sqrt(closes.slice(-20).reduce((s,v)=>s+(v-ma20)*(v-ma20),0)/20);
    const upper=ma20+2*sd, lower=ma20-2*sd;
    const pctb=upper!=lower?(last-lower)/(upper-lower):0.5;
    band={mid:ma20,upper,lower,pctb};
  }
  const vma5=vols.length>=5?vols.slice(-5).reduce((a,b)=>a+b,0)/5:null;
  const vol_ratio=(vma5&&vols.length)?vols[vols.length-1]/vma5:null;
  const mas=[ma5,ma10,ma20,ma30,ma60].filter(m=>m!=null);
  let stance;
  if(mas.length && mas.every(m=>last>m)) stance="多头排列·站稳";
  else if(last>ma20 && ma5 && ma10 && ma5>ma10) stance="震荡偏强";
  else if(mas.length && mas.every(m=>last<m)) stance="空头·走弱";
  else stance="反复震荡";
  return {last,pct,ma5,ma10,ma20,ma30,ma60,band,vol_ratio,stance,ma_count:mas.length};
}

/* ===================== 龙头强度 ===================== */
function leaderScore(q,maxAmount){
  const pct=q.pct||0, amount=q.amount||0, vr=q.vr;
  if(amount<1000) return -999;
  const pct_s=Math.max(0,Math.min(40,(pct+10)/20*40));
  let amt_s=0;
  if(maxAmount>1) amt_s=(Math.min(amount,maxAmount)/maxAmount)*30;
  let vr_s;
  if(vr==null) vr_s=10;
  else if(vr>=1.0 && vr<=3.0) vr_s=30*Math.min(vr/3.0,1.0);
  else if(vr>3.0) vr_s=25-Math.min(15,(vr-3.0)*3);
  else vr_s=Math.max(5,vr*10);
  return pct_s+amt_s+vr_s;
}
function leaderComment(q){
  const pct=q.pct||0, vr=q.vr, amp=q.amp||0;
  if(pct>=9.5) return "涨停/接近涨停，板块最强风向标，明日竞价是关键。";
  if(pct>=7) return `大涨${pct.toFixed(1)}%，强势领涨，量比${vr!=null?vr.toFixed(2):"—"}，资金主动进攻。`;
  if(pct>=3){
    if(vr && vr>=1.5) return `放量突破${pct.toFixed(1)}%，量价配合良好，可视为中军。`;
    if(vr && vr<0.8) return `缩量上涨${pct.toFixed(1)}%，筹码锁定较好，但需补量确认。`;
    return `稳步上涨${pct.toFixed(1)}%，振幅${amp.toFixed(1)}%，跟随龙头情绪。`;
  }
  if(pct>0){
    if(vr && vr>=1.5) return `小阳放量${pct.toFixed(1)}%，资金开始吸筹，尚未成势。`;
    return `微红${pct.toFixed(1)}%，走势偏被动，观望。`;
  }
  if(pct<=-5) return `大跌${Math.abs(pct).toFixed(1)}%，资金出逃，短期回避。`;
  if(pct<0){
    if(vr && vr>=1.5) return `放量下跌${Math.abs(pct).toFixed(1)}%，抛压较重，不宜抄底。`;
    return `跟跌${Math.abs(pct).toFixed(1)}%，板块弱则它更弱。`;
  }
  return "平盘震荡，无明确方向。";
}

/* ===================== 大盘 / 板块 / 综合研判 ===================== */
function marketVerdict(data){
  const idx=data.indices, sa=data.sector_analysis, seg=data.segment;
  const idx_pcts=idx.filter(x=>x.pct!=null).map(x=>x.pct);
  const avg_idx=idx_pcts.length?idx_pcts.reduce((a,b)=>a+b,0)/idx_pcts.length:0;
  let width, width_note;
  if(data.breadth && data.breadth.total){
    width=data.breadth.up/data.breadth.total;
    width_note=`上涨家数占比${(width*100).toFixed(1)}%（${data.breadth.up}/${data.breadth.down}）`;
  }else{
    const pcts=sa.filter(s=>s.pct!=null).map(s=>s.pct);
    width=pcts.length?pcts.filter(p=>p>0).length/pcts.length:0.5;
    width_note=`板块涨跌比${(width*100).toFixed(1)}%（板块ETF代理）`;
  }
  const stance_up=sa.filter(s=>{const t=s.stance||"";return t.indexOf("站稳")>=0||t.indexOf("偏强")>=0;}).length;
  const stance_ratio=sa.length?stance_up/sa.length:0.5;
  const vol_strong=sa.filter(s=>(s.vol_ratio||0)>1.3).length;
  const vol_weak=sa.filter(s=>(s.vol_ratio||0)<0.8).length;
  let temp=Math.round(50+avg_idx*8+(width-0.5)*40+(stance_ratio-0.5)*30);
  temp=Math.max(0,Math.min(100,temp));
  let level;
  if(temp>=75) level="强势·积极";
  else if(temp>=60) level="偏多·结构性机会";
  else if(temp>=45) level="中性·震荡";
  else if(temp>=30) level="偏空·谨慎";
  else level="弱势·冰点";
  const sec_sorted=sa.filter(s=>s.pct!=null).slice().sort((a,b)=>b.pct-a.pct);
  const main_line=sec_sorted.slice(0,3).map(s=>s.name+fmtPct(s.pct)).join("、");
  const risk_line=sec_sorted.slice(-3).map(s=>s.name+fmtPct(s.pct)).join("、");
  const reasons=[];
  if(avg_idx>0.8) reasons.push(`主要指数平均上涨${avg_idx.toFixed(2)}%，权重搭台，指数层面偏暖。`);
  else if(avg_idx<-0.8) reasons.push(`主要指数平均下跌${Math.abs(avg_idx).toFixed(2)}%，权重拖累，指数层面承压。`);
  else reasons.push(`主要指数平均${avg_idx>=0?"+":""}${avg_idx.toFixed(2)}%，指数波动有限，重在结构。`);
  if(width>=0.6) reasons.push(`${width_note}，赚钱效应扩散，情绪不弱。`);
  else if(width<=0.35) reasons.push(`${width_note}，多数个股下跌，情绪偏冷。`);
  else reasons.push(`${width_note}，涨跌各半，资金在板块间快速轮动。`);
  if(stance_ratio>=0.55) reasons.push(`${Math.round(stance_ratio*100)}%的板块均线多头排列或震荡偏强，技术面向好。`);
  else if(stance_ratio<=0.3) reasons.push(`仅${Math.round(stance_ratio*100)}%板块站稳/偏强，多数板块技术形态走弱。`);
  else reasons.push(`${Math.round(stance_ratio*100)}%板块技术形态尚可，但分歧明显。`);
  if(vol_strong>=sa.length*0.4) reasons.push(`${vol_strong}个板块放量（量比>1.3），资金有真金白银进场。`);
  else if(vol_weak>=sa.length*0.4) reasons.push(`${vol_weak}个板块缩量（量比<0.8），交投清淡，难有持续性。`);
  else reasons.push(`量能结构分化，${vol_strong}个放量、${vol_weak}个缩量，存量博弈特征。`);
  const risks=[];
  if(risk_line) risks.push(`领跌板块：${risk_line}，若持续失血将拖累情绪。`);
  if(vol_weak>=sa.length*0.5) risks.push("过半板块缩量，说明资金观望，反弹容易被证伪。");
  if(avg_idx>0 && width<0.45) risks.push("指数红但个股跌多涨少，典型的'指数护盘、个股亏钱'，需警惕。");
  let next_hint="下一时段：关注早盘/尾盘量能是否跟上，若主线板块继续放量，可跟进龙头；若缩量冲高，适合减仓。";
  if(seg=="premarket") next_hint="盘前推演：隔夜美股与日韩为A股提供情绪锚点，开盘后需观察A股能否同步，尤其是主线板块竞价强度。";
  else if(seg=="afterclose") next_hint="盘后推演：收盘已定，重点复盘今日最强板块龙头的量价结构，为次日选股做准备；弱势板块回避。";
  const summary=`当前市场情绪温度 ${temp}/100，判定为「${level}」。主要指数平均${avg_idx>=0?"+":""}${avg_idx.toFixed(2)}%，${width_note}，站稳/偏强板块占比${Math.round(stance_ratio*100)}%。`;
  return {temp,level,summary,main_line,risk_line,reasons,risks,next_hint,avg_idx,width,stance_ratio};
}
function sectorVerdict(s){
  const stance=s.stance||"", band=s.band, vr=s.vol_ratio||0, leaders=s.leaders||[];
  const up_l=leaders.filter(l=>(l.pct||0)>0).length, n_l=leaders.length;
  const pctb=band?band.pctb:0.5;
  const parts=[];
  if(stance.indexOf("站稳")>=0) parts.push("均线多头排列，趋势结构完好。");
  else if(stance.indexOf("偏强")>=0) parts.push("价格站在中短期均线上方，震荡偏强。");
  else if(stance.indexOf("空头")>=0||stance.indexOf("走弱")>=0) parts.push("均线空头压制，趋势向下。");
  else parts.push("均线缠绕，方向待选。");
  if(pctb>0.8) parts.push("价格贴近/突破布林上轨，短期偏热，注意冲高回落。");
  else if(pctb<0.2) parts.push("价格跌至布林下轨附近，超卖，等待企稳信号。");
  else parts.push("价格运行在布林中轨附近，属于正常波动区间。");
  if(vr>=1.5) parts.push(`量比${vr.toFixed(2)}，明显放量，资金关注度提升。`);
  else if(vr>=1.0) parts.push(`量比${vr.toFixed(2)}，温和放量，动能尚可。`);
  else if(vr>0) parts.push(`量比${vr.toFixed(2)}，缩量运行，持续性存疑。`);
  if(n_l){
    const lead_pct=leaders[0].pct||0;
    if(lead_pct>=5) parts.push(`龙头${leaders[0].name}大涨${lead_pct.toFixed(2)}%，板块有引领核心，赚钱效应可扩散。`);
    else if(lead_pct>=2) parts.push(`龙头${leaders[0].name}上涨${lead_pct.toFixed(2)}%，板块内部有带头但强度一般。`);
    else if(lead_pct<0) parts.push(`龙头${leaders[0].name}下跌${Math.abs(lead_pct).toFixed(2)}%，风向标走弱，板块难有作为。`);
    else parts.push(`龙头${leaders[0].name}微红${lead_pct.toFixed(2)}%，方向尚未明确。`);
  }
  const major_up=leaders.filter(l=>(l.pct||0)>=2).length;
  const major_down=leaders.filter(l=>(l.pct||0)<=-2).length;
  let tag;
  if((stance.indexOf("站稳")>=0||stance.indexOf("偏强")>=0) && vr>=1.0 && up_l>=Math.max(3,n_l/2) && major_up>=2) tag="强势·可重点关注";
  else if((stance.indexOf("站稳")>=0||stance.indexOf("偏强")>=0) && vr<1.0 && up_l>=Math.max(3,n_l/2)) tag="趋势尚可·龙头齐涨但需补量";
  else if((stance.indexOf("站稳")>=0||stance.indexOf("偏强")>=0) && vr<1.0) tag="趋势尚可但缩量·观望";
  else if(pctb<0.2 && vr>=1.2) tag="超跌放量·关注反弹";
  else if((stance.indexOf("空头")>=0||stance.indexOf("走弱")>=0) || major_down>=3 || (up_l==0&&n_l>=4)) tag="弱势·回避";
  else if(major_up>=3 && vr>=1.0) tag="龙头驱动·可跟踪";
  else tag="震荡·方向待选";
  return {text:parts.join(""),tag,lead_up:up_l,lead_total:n_l};
}
function overallConclusion(v,data){
  const temp=v.temp, level=v.level, seg=data.segment;
  const main=v.main_line||"暂无明确主线", risk=v.risk_line||"暂无显著风险板块";
  let position,tactic;
  if(temp>=75){position="7-8成";tactic="积极进攻主线龙头，逢回调加仓强势板块。";}
  else if(temp>=60){position="5-6成";tactic="轻指数重个股，只做放量确认的强势板块，不追涨缩量票。";}
  else if(temp>=45){position="3-5成";tactic="震荡市高抛低吸，主线低吸、破位即走，不留恋弱势股。";}
  else if(temp>=30){position="2-3成";tactic="控制仓位，仅做逆势龙头或超跌反弹，破位坚决止损。";}
  else{position="≤2成";tactic="冰点期以观望为主，等待放量阳线或情绪回暖信号。";}
  const lines=[
    `【市场定位】情绪温度${temp}/100，判定为「${level}」。`,
    `【主线方向】${main}`,
    `【风险方向】${risk}`,
    `【仓位建议】${position}。`,
    `【操作策略】${tactic}`
  ];
  if(v.risks&&v.risks.length) lines.push("【关键风险】"+v.risks.join("；"));
  if(v.next_hint) lines.push("【下一时段推演】"+v.next_hint);
  if(seg=="premarket") lines.push("【盘前执行清单】1. 看隔夜美股板块；2. 看A50/汇率；3. 开盘后第一时间观察主线竞价强度与量能。");
  else if(seg=="intraday") lines.push("【盘中执行清单】1. 只做主线里量比>1的龙头；2. 跌破MA20或放量滞涨减仓；3. 尾盘不追缩量冲高。");
  else lines.push("【盘后执行清单】1. 记录今日最强板块及龙头；2. 剔除破位板块；3. 为次日制定1-2个重点观察方向。");
  return lines.join("\n");
}
function usVerdict(data){
  const usi=data.us_indices, uss=data.us_sectors;
  const pcts=[...usi,...uss].filter(x=>x.pct!=null).map(x=>x.pct);
  if(!pcts.length) return null;
  const avg=pcts.reduce((a,b)=>a+b,0)/pcts.length;
  const ss=uss.filter(x=>x.pct!=null).slice().sort((a,b)=>b.pct-a.pct);
  const top_us=ss.slice(0,3).map(s=>s.name+fmtPct(s.pct)).join("、");
  const weak_us=ss.slice(-3).map(s=>s.name+fmtPct(s.pct)).join("、");
  let lvl,impact;
  if(avg>0.5){lvl="risk-on·偏暖";impact="美股偏暖通常有利于A股高开，但高开后能否稳住取决于A股自身量能。";}
  else if(avg>-0.5){lvl="中性";impact="美股波动有限，A股将按自身节奏运行，关注国内政策与资金情绪。";}
  else{lvl="risk-off·偏冷";impact="美股走弱可能拖累A股低开，但若A股主线强势，容易出现独立行情。";}
  const map=[];
  if(ss.slice(0,5).some(s=>s.name==="科技"||s.name==="半导体")) map.push("科技/半导体领涨：利好A股科创、芯片、AI算力映射。");
  if(ss.slice(0,5).some(s=>s.name==="能源"||s.name==="材料")) map.push("能源/材料领涨：利好A股有色、化工、煤炭。");
  if(ss.slice(-5).some(s=>s.name==="金融"||s.name==="房地产")) map.push("金融/地产走弱：对A股券商、地产形成情绪压制。");
  if(!map.length) map.push("板块映射不明显，盘中以A股实际资金流向为准。");
  return {summary:`美股隔夜平均${avg>=0?"+":""}${avg.toFixed(2)}%，${lvl}（三大指数+行业板块均值）。`,impact,top,weak,map:map.join(" ")};
}

/* ===================== 组装数据 ===================== */
async function gather(){
  const bj=bjNow();
  const seg=segmentOf(bj.hour);
  // 收集所有需要实时行情的代码
  const codes=new Set();
  CFG.indices.forEach(c=>codes.add(c.code));
  CFG.watchlist.forEach(c=>codes.add(c.code));
  Object.values(CFG.us_sectors).forEach(c=>codes.add(c));
  Object.values(CFG.us_indices).forEach(c=>codes.add(c));
  CFG.hk_hengke.forEach(c=>codes.add(c.code));
  CFG.hk_hengu.forEach(c=>codes.add(c.code));
  Object.values(CFG.sector_etfs).forEach(c=>codes.add(c));
  const leaderCodes=new Set();
  Object.values(CFG.sector_leaders).forEach(arr=>arr.forEach(c=>{codes.add(c);leaderCodes.add(c);}));
  const tx=await fetchTx([...codes]);
  const nameOf=(cfgItem,code)=> (tx[code]&&tx[code].name)||(cfgItem&&cfgItem.name)||code;

  const indices=CFG.indices.map(c=>{const d=tx[c.code];return d?{name:d.name,price:d.price,pct:d.pct,code:c.code}:{name:c.name,price:null,pct:null,code:c.code};});
  const watchlist=CFG.watchlist.map(c=>{const d=tx[c.code];return d?{name:d.name,price:d.price,pct:d.pct,code:c.code}:{name:c.name,price:null,pct:null,code:c.code};});
  const us_indices=Object.keys(CFG.us_indices).map(n=>{const code=CFG.us_indices[n];const d=tx[code];return d?{name:d.name,pct:d.pct}:{name:n,pct:null};});
  const us_sectors=Object.keys(CFG.us_sectors).map(n=>{const code=CFG.us_sectors[n];const d=tx[code];return d?{name:d.name,pct:d.pct}:{name:n,pct:null};});
  const hk_hengke=CFG.hk_hengke.map(c=>{const d=tx[c.code];return d?{name:d.name,price:d.price,pct:d.pct,code:c.code}:{name:c.name,price:null,pct:null,code:c.code};});
  const hk_hengu=CFG.hk_hengu.map(c=>{const d=tx[c.code];return d?{name:d.name,price:d.price,pct:d.pct,code:c.code}:{name:c.name,price:null,pct:null,code:c.code};});

  // 板块技术分析（K线）
  const sa=[];
  for(const [name,code] of Object.entries(CFG.sector_etfs)){
    const kl=await fetchKline(code);
    const a=analyzeKline(kl);
    if(a){a.name=name;a.code=code;sa.push(a);}
    await sleep(70);
  }
  // 板块涨跌比（宽度代理）
  const sp=sa.filter(s=>s.pct!=null);
  const up=sp.filter(s=>s.pct>0).length, down=sp.filter(s=>s.pct<0).length;
  const breadth={up,down,flat:sp.length-up-down,total:sp.length};
  // 板块龙头（动态强度）
  const leaderQuotes={};
  leaderCodes.forEach(c=>{if(tx[c])leaderQuotes[c]=tx[c];});
  const maxAmount=Math.max(1,...Object.values(leaderQuotes).map(q=>q.amount||0));
  for(const s of sa){
    const cands=CFG.sector_leaders[s.name]||[];
    const items=cands.map(c=>{
      const q=tx[c];if(!q||q.pct==null||(q.amount||0)<1000) return null;
      return {code:c,name:q.name,pct:q.pct,price:q.price,amount:q.amount,vr:q.vr,amp:q.amp,score:leaderScore(q,maxAmount)};
    }).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,5);
    if(items.length){
      const top_pct=items[0].pct;
      items.forEach(it=>it.comment=leaderComment(it));
    }
    s.leaders=items;
  }
  const data={segment:seg,now:bj.now,indices,watchlist,sector_analysis:sa,breadth,
              us_indices,us_sectors,hk_hengke,hk_hengu};
  // 实时兜底：若腾讯接口整体拉取失败（微信 GBK/网络问题），回退同域快照
  const liveValid = Object.keys(tx).length>0 || sa.some(s=>s.pct!=null) || indices.some(x=>x.pct!=null);
  if(!liveValid){
    try{
      const r=await fetch("./snapshot.json",{cache:"no-store"});
      if(r.ok){ const snap=await r.json(); snap.data.now=new Date();
        return {data:snap.data, ts:(snap.ts||"")+" · 实时获取失败,已用最近一次服务端快照兜底"}; }
    }catch(e){ console.warn("snapshot fallback fail",e); }
  }
  return {data,ts:bj.str};
}
